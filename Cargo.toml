[package]
name = "masking-room"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
regex = "1"

[dev-dependencies]
tempfile = "3"
